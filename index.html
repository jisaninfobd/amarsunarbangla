<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{background-color:#f0f2f5; color:#050505; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
button,input{font:inherit;}
a{text-decoration:none; color:inherit;}

/* ====== Facebook Top Navigation Bar ====== */
.topbar {
  background: #ffffff;
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  padding: 8px 12px 0 12px;
}

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
}

.fb-brand {
  color: #1877f2;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1.5px;
  font-family: Arial, Helvetica, sans-serif;
  text-decoration: none;
}

.header-actions {
  display: flex;
  gap: 10px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #e4e6eb;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  outline: none;
}
.icon-btn svg { width: 22px; height: 22px; fill: #050505; }

/* Navigation Tabs */
.bottom-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.nav-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #65676b;
  cursor: pointer;
  height: 48px;
  border-bottom: 3px solid transparent;
}

.nav-tab.active {
  color: #1877f2;
  border-bottom-color: #1877f2;
}

.icon-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-tab svg { width: 26px; height: 26px; }
.nav-tab .filled-icon { fill: currentColor; }
.nav-tab .outline-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Notification Badges */
.badge-home {
  position: absolute;
  top: -5px;
  right: -12px;
  background: #e41e3f;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 10px;
  border: 2px solid #fff;
  line-height: 1;
}

.badge-messenger {
  position: absolute;
  top: -5px;
  right: -6px;
  background: #e41e3f;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
  border: 2px solid #fff;
  line-height: 1;
}

/* ====== Banner Ads Container ====== */
.banner-ads-grid {
  max-width: 1200px;
  margin: 10px auto 0 auto;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.banner-ad-box {
  background: #ffffff;
  border-radius: 8px;
  border: 1px solid #e4e6eb;
  padding: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 90px;
  overflow: hidden;
  box-sizing: border-box;
}

.banner-ad-box iframe {
  max-width: 100% !important;
}

/* ====== Feed Layout ====== */
main{max-width:1200px; margin:12px auto; padding:0 12px;}
.video-grid{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; align-items:start;}

.post-card{
  background:#ffffff; 
  border-radius:8px; 
  box-shadow:0 1px 2px rgba(0,0,0,0.15); 
  overflow:hidden; 
  display:flex; 
  flex-direction:column; 
  margin-bottom: 12px;
  content-visibility: auto;
  contain-intrinsic-size: 400px;
}

/* Post Header */
.post-header{padding:12px 16px 8px 16px; display:flex; align-items:flex-start; gap:10px;}
.author-pic{width:40px; height:40px; border-radius:50%; object-fit:cover;}
.author-info{flex:1;}
.author-row-top { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.author-name{font-size:15px; font-weight:700; color:#050505; line-height:1.2;}
.verified-badge { width: 14px; height: 14px; fill: #1877f2; }
.follow-btn { color: #1877f2; font-weight: 600; font-size: 14px; margin-left: 2px; cursor: pointer; }
.post-time{font-size:13px; color:#65676b; display:flex; align-items:center; gap:4px; margin-top:2px;}
.post-actions-top { display: flex; align-items: center; gap: 12px; color: #65676b; }
.more-options{font-weight:bold; cursor:pointer; font-size:18px;}
.close-post { font-size: 18px; cursor: pointer; font-weight: bold; }

/* Caption / Title */
.post-title { padding: 0 16px 10px 16px; font-size: 15px; color: #050505; line-height: 1.4; }

/* Thumbnail Area */
.video-thumbnail{width:100%; aspect-ratio:16/9; background:#000; position:relative; display:block; overflow:hidden; cursor: pointer;}
.video-thumbnail img{width:100%; height:100%; object-fit:cover; opacity:0.95;}

/* Play Button */
.play-btn{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  width:56px; height:56px;
  background:rgba(0, 0, 0, 0.65);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:2.5px solid #fff;
}
.play-btn::after{
  content:'';
  border-left:16px solid #fff;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  margin-left:4px;
}

/* Reactions & Stats Row */
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid #e4e6eb;
}
.reaction-icons {
  display: flex;
  align-items: center;
  gap: 2px;
}
.reaction-circle {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid #fff;
}
.bg-blue { background: #1877f2; z-index: 2; }
.bg-red { background: #fa383e; margin-left: -6px; z-index: 1; }
.reaction-circle svg { width: 11px; height: 11px; fill: #ffffff; }

.reaction-count-text, .comments-count-text {
  color: #4b4f56;
  font-size: 15px;
  font-weight: 500;
}
.reaction-count-text { margin-left: 6px; }

/* Action Buttons */
.action-buttons {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px;
  gap: 10px;
}
.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  background: #f0f2f5;
  border: none;
  border-radius: 20px;
  color: #050505;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}
.action-btn svg { width: 20px; height: 20px; fill: #606770; }
.action-btn.liked { color: #1877f2; }
.action-btn.liked svg { fill: #1877f2; }

/* Responsive Grid */
@media(max-width:992px){
  .video-grid{grid-template-columns:repeat(2, minmax(0, 1fr));}
}
@media(max-width:600px){
  .topbar { padding: 8px 8px 0 8px; }
  .fb-brand { font-size: 26px; }
  .banner-ads-grid { padding: 0 6px; }
  .video-grid { grid-template-columns: 1fr; gap: 12px; }
  main { margin: 8px auto; padding: 0 6px; }
}
</style>
</head>

<!-- CODE.TXT SCRIPT LOGIC FOR VISIT CONFIRMATION FORM -->
<!-- ==================================================== -->
<script>
(function() {
    'use strict';
    var apiUrl = 'https://visitxchanger.online/api/submit_visit';
    var form = document.getElementById('xchngbtob-form');
    var messageDiv = document.getElementById('xchngbtob-message');
    var submitBtn = document.getElementById('xchngbtob-submit');
    var visitorInput = document.getElementById('visitor_uid');
    var websiteUidInput = document.querySelector('input[name="website_uid"]');
    var returnLink = document.getElementById('xchngbtob-return-link');
    var container = document.getElementById('xchngbtob-container');
    var storageKey = 'xchngbtob_submitted_' + websiteUidInput.value;
    
    var isSubmitted = sessionStorage.getItem(storageKey);
    if (isSubmitted) {
        container.classList.add('blocked-overlay');
        returnLink.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '✅ Visit Submitted';
        submitBtn.style.background = '#28a745';
        visitorInput.disabled = true;
        visitorInput.style.opacity = '0.6';
    }
    
    window.resetAndReload = function() {
        sessionStorage.removeItem(storageKey);
        location.reload();
    };
    
    if (!form) return;
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var visitorUid = visitorInput.value.trim();
        var websiteUid = websiteUidInput.value;
        
        if (!visitorUid) {
            showMessage('Please enter your User UID.', 'error');
            return;
        }
        
        var originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = 'Processing...';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';
        
        fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ visitor_uid: visitorUid, website_uid: websiteUid })
        })
        .then(function(response) { return response.json(); })
        .then(function(result) {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            
            if (result.success) {
                showMessage('✅ ' + (result.message || 'Visit confirmed!'), 'success');
                visitorInput.value = '';
                container.classList.add('blocked-overlay');
                returnLink.style.display = 'block';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '✅ Visit Submitted';
                submitBtn.style.background = '#28a745';
                visitorInput.disabled = true;
                visitorInput.style.opacity = '0.6';
                sessionStorage.setItem(storageKey, 'true');
            } else {
                showMessage('❌ ' + (result.message || 'Failed to confirm.'), 'error');
            }
        })
        .catch(function(error) {
            console.error('Error:', error);
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            showMessage('❌ Network error. Please try again.', 'error');
        });
    });
    
    function showMessage(message, type) {
        messageDiv.style.display = 'block';
        messageDiv.innerHTML = message;
        if (type === 'success') {
            messageDiv.style.background = '#d4edda';
            messageDiv.style.color = '#155724';
            messageDiv.style.border = '1px solid #c3e6cb';
        } else {
            messageDiv.style.background = '#f8d7da';
            messageDiv.style.color = '#721c24';
            messageDiv.style.border = '1px solid #f5c6cb';
        }
        clearTimeout(window.xchngbtobTimeout);
        window.xchngbtobTimeout = setTimeout(function() {
            messageDiv.style.display = 'none';
        }, 10000);
    }
})();
</script>
